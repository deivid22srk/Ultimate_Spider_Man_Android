name: build

# The APK is only ever built here, never on a developer machine.
#
# Two modes:
#   app-only (default): builds the launcher + runtime against ci/gen_stub.
#       The APK installs and the launcher validates the game folder, but it
#       contains no recompiled game code, so Play stops with a clear message.
#       This mode needs nothing from the game and is safe for a public repo.
#   full: downloads gen.tar.zst (the recompiled C, derived from the user's own
#       game files) from a *private* release of this repository and builds the
#       real APK. gen/ is never committed and never published.

on:
  workflow_dispatch:
    inputs:
      gen_release:
        description: "Private release tag that holds gen.tar.zst (empty = app-only build)"
        required: false
        default: ""
      lb_gen_jobs:
        description: "Parallel compiles of recompiled files (RAM: ~1.5 GB each)"
        required: false
        default: "2"
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Toolchain versions
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk"
          cmake --version | head -1

      # ---- recompiled code -------------------------------------------------
      # full mode: private release asset. app-only: stub tables (no game code).
      - name: Fetch recompiled code (private release)
        if: ${{ inputs.gen_release != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.gen_release }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gen"
          gh release download "$TAG" --pattern 'gen.tar.zst*' --dir "$RUNNER_TEMP/gen" \
            --repo "$GITHUB_REPOSITORY"
          cd "$RUNNER_TEMP/gen"
          if ls gen.tar.zst.part* >/dev/null 2>&1; then cat gen.tar.zst.part* > gen.tar.zst; fi
          mkdir -p "$GITHUB_WORKSPACE/gen"
          zstd -d --stdout gen.tar.zst | tar -xf - -C "$GITHUB_WORKSPACE/gen"
          echo "gen/: $(ls "$GITHUB_WORKSPACE/gen"/*.c | wc -l) C files, $(du -sh "$GITHUB_WORKSPACE/gen" | cut -f1)"

      - name: Use stub tables (app-only build)
        if: ${{ inputs.gen_release == '' }}
        run: |
          mkdir -p gen
          cp ci/gen_stub/* gen/
          echo "app-only build: gen/ has only the stub tables"

      - name: Build APK
        working-directory: android
        env:
          LB_GEN_JOBS: ${{ inputs.lb_gen_jobs }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PndkVersion=27.2.12479018 \
            -PlbGenJobs="${LB_GEN_JOBS:-2}"

      - name: Rename artifact
        run: |
          mkdir -p out
          if [ -n "${{ inputs.gen_release }}" ]; then NAME=UltimateSpiderMan-full; else NAME=UltimateSpiderMan-apponly; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/$NAME.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: UltimateSpiderMan-apk
          path: out/*.apk
          if-no-files-found: error
