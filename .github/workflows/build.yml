name: build

# The APK is only ever built here, never on a developer machine.
#
# Strategy B: this repository is public and contains no game code and no code
# generated from the game. The workflow therefore builds the launcher and the
# runtime against ci/gen_stub (empty recompiled tables):
#
#   * the APK installs, the launcher validates your game folder and the exe
#     build, and "Play" stops with a clear message;
#   * it proves the whole Android/runtime build works, on every push.
#
# The full APK (with the game's recompiled code) is built from gen/, which is
# derived from your own copy of the game and must never be published. Do that
# in a private fork of this repository (drop gen/ in, the same workflow then
# compiles it), or build locally with Android Studio / gradlew. See README,
# "Building the full APK".

on:
  workflow_dispatch:
    inputs:
      lb_gen_jobs:
        description: "Parallel compiles of recompiled files (RAM: ~1.5 GB each)"
        required: false
        default: "2"
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Toolchain versions
        run: |
          java -version
          ls "$ANDROID_HOME/ndk"
          cmake --version | head -1

      # No game code in this repository: gen/ is either the stub (public CI) or
      # the real, git-ignored gen/ when this workflow runs in a private fork.
      - name: Use stub tables when gen/ is absent
        run: |
          if [ -z "$(ls -A gen 2>/dev/null)" ]; then
            mkdir -p gen
            cp ci/gen_stub/* gen/
            echo "gen/ absent: building the app-only APK"
          else
            echo "gen/ present: building the full APK ($(ls gen/*.c | wc -l) C files)"
          fi

      - name: Build APK
        working-directory: android
        env:
          LB_GEN_JOBS: ${{ inputs.lb_gen_jobs }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PndkVersion=27.2.12479018 \
            -PlbGenJobs="${LB_GEN_JOBS:-2}"

      - name: Collect artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/UltimateSpiderMan.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: UltimateSpiderMan-apk
          path: out/UltimateSpiderMan.apk
          if-no-files-found: error
